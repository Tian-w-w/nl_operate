name: Engineering checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t llm4web:ci .

  unit:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      MODEL_ADAPTER: rules
      MODEL_CALLS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m ruff check backend evaluation scripts tests
      - run: python -m scripts.generate_contracts --check
      - run: python -m pytest -m "not postgres" --basetemp=runtime/pytest-ci

  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: llm4web_test
          POSTGRES_USER: llm4web
          POSTGRES_PASSWORD: ci_only_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U llm4web -d llm4web_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://llm4web:ci_only_password@127.0.0.1:5432/llm4web_test
      MODEL_ADAPTER: rules
      MODEL_CALLS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m pytest -m postgres --basetemp=runtime/pytest-pg-ci

  browser:
    runs-on: ubuntu-24.04
    env:
      LLM4WEB_PYTHON: python
      PLAYWRIGHT_CHANNEL: chromium
      MODEL_ADAPTER: rules
      MODEL_CALLS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.lock
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python -m scripts.manage fixture-reset --database sqlite:///./runtime/llm4web_fixture_e2e.db --confirm-fixture
      - run: npm run test:e2e
        working-directory: frontend
      - run: npm run test:agent
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: frontend/test-results/
